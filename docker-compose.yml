services:
  # ==========================================
  # P1: Document Processing (SmolDocling v2)
  # ==========================================
  docling-service:
    build: ./services/docling-service
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      PYTHONUNBUFFERED: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # ==========================================
  # P2: Field Extraction (Qwen2.5 via llama.cpp)
  # ==========================================
  qwen-service:
    build: ./services/qwen-service
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      QWEN_MODEL_PATH: /app/models/qwen2.5-0.5b-instruct-q4_0.gguf
      PYTHONUNBUFFERED: 1
    volumes:
      - qwen_models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # ==========================================
  # P3: Haystack Orchestration & HITL
  # ==========================================
  orchestrator-service:
    build: ./services/orchestrator-service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DOCLING_SERVICE_URL: http://docling-service:5004
      QWEN_SERVICE_URL: http://qwen-service:5005
      LABEL_STUDIO_URL: http://label-studio:8080
      LABEL_STUDIO_API_KEY: ${LABEL_STUDIO_API_KEY:-}
      LABEL_STUDIO_PROJECT_ID: ${LABEL_STUDIO_PROJECT_ID:-1}
      CONFIDENCE_THRESHOLD: 0.90
    depends_on:
      - docling-service
      - qwen-service
      - label-studio
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ==========================================
  # Label Studio (HITL)
  # ==========================================
  label-studio:
    image: heartexlabs/label-studio:latest
    ports:
      - "8080:8080"
    environment:
      LABEL_STUDIO_HOST: http://localhost:8080
      LABEL_STUDIO_USERNAME: admin@localhost
      LABEL_STUDIO_PASSWORD: admin123
      # Use shared PostgreSQL database
      DJANGO_DB: default
      POSTGRE_NAME: rossumxml
      POSTGRE_USER: postgres
      POSTGRE_PASSWORD: postgres
      POSTGRE_HOST: db
      POSTGRE_PORT: 5432
      # Disable default SQLite
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
      # Disable strict CSP for development
      LABEL_STUDIO_CSP_SCRIPT_SRC: "'self' 'unsafe-inline' 'unsafe-eval'"
      LABEL_STUDIO_CSP_STYLE_SRC: "'self' 'unsafe-inline'"
      LABEL_STUDIO_CSP_FONT_SRC: "'self' data:"
    depends_on:
      - db
    volumes:
      - label_studio_data:/label-studio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # ==========================================
  # Legacy Backend (XML Transformation + Invoice API)
  # ==========================================
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rossumxml
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET: 6e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e
      # Redis connection for Bull queue
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Route invoice extraction to new microservices
      INVOICE_EXTRACTION_URL: http://orchestrator-service:8000
      API_GATEWAY_URL: http://orchestrator-service:8000
    depends_on:
      - db
      - redis
      - orchestrator-service
    restart: unless-stopped

  # Extraction Worker (Bull Queue Consumer)
  # ==========================================
  worker:
    build: ./backend
    command: node workers/extractionWorker.js
    environment:
      NODE_ENV: development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rossumxml
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Redis connection for Bull queue
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Microservices endpoints
      API_GATEWAY_URL: http://orchestrator-service:8000
      SOCKET_SERVER_URL: http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - orchestrator-service
    restart: unless-stopped

  # ==========================================
  # Infrastructure Services
  # ==========================================
  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_DB: rossumxml
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  label_studio_data:
  qwen_models: